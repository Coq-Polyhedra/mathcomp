name: CI

on:
  push:
    branches: [master, coq-8.20]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '8.20.1'
          ocaml_version: '4.14.2-flambda'
          custom_script: |
            startGroup "Build the ssreflect, fingroup and algebra packages"
              sudo chown -R coq:coq .
              opam pin add -y -n coq-mathcomp-ssreflect .
              opam pin add -y -n coq-mathcomp-fingroup .
              opam pin add -y -n coq-mathcomp-algebra .
              opam install -y -j 2 coq-mathcomp-algebra
            endGroup
